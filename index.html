<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--red:#E8340A;--orange:#F5600F;--green:#16a34a;--font-h:'Playfair Display',serif;--font-b:'DM Sans',sans-serif;--radius:20px;--radius-sm:12px}
[data-theme="light"]{--bg:#FBF5EC;--bg2:#F6EDE0;--bg3:#F0E3D0;--surface:#FFFFFF;--surface2:#FAF3E8;--dark:#1C0A02;--ink:#3A1C08;--muted:#9A7255;--light-muted:#C8A882;--gold:#B8820A;--border:rgba(160,90,20,0.14);--border2:rgba(160,90,20,0.07);--card:#FFFFFF;--card2:#FAF0E4;--nav-bg:rgba(251,245,236,0.96);--sh:0 1px 12px rgba(100,50,10,0.09),0 4px 20px rgba(100,50,10,0.06);--sh-lg:0 6px 32px rgba(100,50,10,0.14),0 18px 48px rgba(100,50,10,0.08);--sh-glow:0 0 0 3px rgba(232,52,10,0.16);--strip:#F0E6D4;--strip-border:rgba(160,90,20,0.10);--modal-bg:rgba(30,10,2,0.72);--input-bg:#FFF8F0;--input-border:rgba(160,90,20,0.18);--dash-bg:#FAF3E8;--tag-bg:rgba(232,52,10,0.09);--tag-c:#C02808;--faq-bg:#FFFFFF;--promo-bg:linear-gradient(135deg,#1C0A02 0%,#3A1208 100%)}
[data-theme="dark"]{--bg:#110804;--bg2:#180C05;--bg3:#1E1008;--surface:#1A0D06;--surface2:#231208;--dark:#F5EAD8;--ink:#DEC89A;--muted:#8A6A50;--light-muted:#5A3E28;--gold:#D4920A;--border:rgba(245,166,35,0.09);--border2:rgba(245,166,35,0.05);--card:#1C0E07;--card2:#261508;--nav-bg:rgba(10,5,0,0.97);--sh:0 2px 20px rgba(0,0,0,0.60),0 8px 32px rgba(0,0,0,0.40);--sh-lg:0 8px 40px rgba(0,0,0,0.75),0 24px 64px rgba(0,0,0,0.50);--sh-glow:0 0 0 3px rgba(232,52,10,0.25);--strip:#0C0602;--strip-border:rgba(245,166,35,0.06);--modal-bg:rgba(0,0,0,0.90);--input-bg:#140900;--input-border:rgba(245,166,35,0.14);--dash-bg:#140900;--tag-bg:rgba(232,52,10,0.16);--tag-c:#FF7040;--faq-bg:#1C0E07;--promo-bg:linear-gradient(135deg,#0A0300 0%,#1A0805 100%)}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--font-b);background:var(--bg);color:var(--ink);overflow-x:hidden;transition:background .35s,color .35s;-webkit-font-smoothing:antialiased}
.bg-atmo{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
[data-theme="light"] .bg-atmo::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 70% 55% at 8% 12%,rgba(255,160,80,0.16) 0%,transparent 60%),radial-gradient(ellipse 55% 45% at 92% 82%,rgba(255,110,30,0.10) 0%,transparent 60%),radial-gradient(ellipse 40% 35% at 52% 52%,rgba(255,210,140,0.06) 0%,transparent 65%)}
[data-theme="dark"] .bg-atmo::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 15% 20%,rgba(150,40,5,0.18) 0%,transparent 65%),radial-gradient(ellipse 60% 50% at 85% 75%,rgba(100,25,0,0.14) 0%,transparent 60%),radial-gradient(ellipse 40% 35% at 50% 50%,rgba(80,20,0,0.10) 0%,transparent 70%)}
.bg-atmo::after{content:'';position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");opacity:0.025;mix-blend-mode:multiply}
.bg-smoke{position:fixed;inset:0;z-index:0;pointer-events:none}
.smoke-orb{position:absolute;border-radius:50%;filter:blur(80px);animation:smokeFloat ease-in-out infinite;pointer-events:none}
[data-theme="light"] .smoke-orb{opacity:0.35}
@keyframes smokeFloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-30px) scale(1.08)}}
.promo-banner{position:fixed;top:0;left:0;right:0;z-index:400;background:var(--promo-bg);padding:8px 20px;display:flex;align-items:center;justify-content:center;gap:14px;font-size:12px;color:#F5EAD8;transition:transform .4s;border-bottom:1px solid rgba(232,52,10,0.3)}
.promo-banner.hidden{transform:translateY(-100%)}
.promo-text{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center}
.promo-text strong{color:#fff}
.promo-code{background:rgba(232,52,10,0.3);border:1px solid rgba(232,52,10,0.5);padding:3px 10px;border-radius:100px;font-weight:700;color:#FF8A60;letter-spacing:1px;font-size:11px;cursor:pointer;transition:all .2s}
.promo-code:hover{background:var(--red);color:#fff}
.promo-timer{display:flex;align-items:center;gap:4px;font-family:var(--font-h);font-weight:700;color:var(--red);font-size:13px}
.promo-timer span{background:rgba(232,52,10,0.2);padding:2px 6px;border-radius:5px;min-width:24px;text-align:center;font-size:12px;color:#FF8A60}
.promo-close{background:transparent;border:none;color:rgba(245,234,216,0.4);font-size:16px;cursor:pointer;padding:4px;transition:color .2s;flex-shrink:0}
.promo-close:hover{color:#fff}
.theme-toggle{position:fixed;bottom:80px;right:18px;z-index:499;width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--border);box-shadow:var(--sh-lg);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .25s}
.theme-toggle:hover{transform:scale(1.12);box-shadow:0 8px 28px rgba(232,52,10,0.28)}
.scroll-top{position:fixed;bottom:80px;left:18px;z-index:499;width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--border);box-shadow:var(--sh);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .3s;opacity:0;transform:translateY(10px);pointer-events:none}
.scroll-top.visible{opacity:1;transform:none;pointer-events:all}
.scroll-top:hover{background:var(--red);border-color:var(--red);color:#fff;transform:translateY(-2px)}
.scroll-progress{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--red),var(--orange));z-index:9999;width:0;border-radius:0 3px 3px 0}
nav{position:fixed;top:36px;left:0;right:0;z-index:300;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:var(--nav-bg);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--border);transition:box-shadow .3s,top .4s}
nav.scrolled{box-shadow:var(--sh)}
nav.promo-hidden{top:0}
.nav-logo{font-family:var(--font-h);font-size:22px;font-weight:900;color:var(--dark);letter-spacing:-.5px;text-decoration:none;flex-shrink:0;line-height:1}
.nav-logo span{color:var(--red)}
.nav-logo small{font-family:var(--font-b);font-size:9px;font-weight:500;color:var(--muted);display:block;letter-spacing:1px;text-transform:uppercase;margin-top:-2px}
.nav-links{display:flex;gap:28px;list-style:none;align-items:center}
.nav-links a{text-decoration:none;color:var(--muted);font-size:13px;font-weight:500;transition:color .2s;position:relative}
.nav-links a:hover{color:var(--dark)}
.nav-links a::after{content:'';position:absolute;bottom:-3px;left:0;width:0;height:2px;background:var(--red);border-radius:2px;transition:width .25s}
.nav-links a:hover::after{width:100%}
.nav-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.btn-red{background:var(--red);color:#fff;padding:10px 22px;border-radius:100px;font-size:13px;font-weight:700;text-decoration:none;border:none;cursor:pointer;font-family:var(--font-b);box-shadow:0 4px 18px rgba(232,52,10,0.32);transition:all .2s;white-space:nowrap;position:relative;overflow:hidden}
.btn-red::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);transform:translateX(-100%);transition:none}
.btn-red:hover{background:var(--orange);transform:translateY(-1px);box-shadow:0 6px 24px rgba(232,52,10,0.46)}
.btn-red:hover::before{transform:translateX(100%);transition:transform .6s}
.btn-ghost{display:flex;align-items:center;gap:8px;padding:9px 18px;border-radius:100px;border:1px solid var(--border);background:transparent;color:var(--ink);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;font-family:var(--font-b);white-space:nowrap}
.btn-ghost:hover{border-color:var(--red);color:var(--red);background:rgba(232,52,10,0.05)}
.cart-badge{position:relative}
.cart-badge .badge-count{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:9px;font-weight:700;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--card)}
.cart-badge .badge-count.bump{animation:cartBump .4s ease}
@keyframes cartBump{0%{transform:scale(1)}50%{transform:scale(1.4)}100%{transform:scale(1)}}
.nav-ham{display:none;flex-direction:column;justify-content:center;gap:5px;cursor:pointer;padding:5px;border:none;background:transparent}
.nav-ham span{display:block;width:20px;height:1.5px;background:var(--dark);border-radius:2px;transition:all .3s}
.mob-drawer{position:fixed;top:98px;left:0;right:0;z-index:299;background:var(--nav-bg);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);padding:8px 0 14px;transform:translateY(-110%);transition:transform .32s cubic-bezier(.22,1,.36,1);box-shadow:0 8px 32px rgba(0,0,0,.12)}
.mob-drawer.open{transform:none}
.mob-drawer a,.mob-drawer button{display:flex;align-items:center;gap:10px;padding:13px 24px;font-size:15px;font-weight:500;color:var(--ink);text-decoration:none;border:none;background:none;width:100%;text-align:left;cursor:pointer;font-family:var(--font-b);transition:background .15s}
.mob-drawer a:hover,.mob-drawer button:hover{background:rgba(232,52,10,0.05)}
.mob-drawer hr{border:none;border-top:1px solid var(--border);margin:4px 24px}
.hero{min-height:100svh;display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:40px;padding:130px 52px 60px;position:relative;z-index:1}
.hero-badge{display:inline-flex;align-items:center;gap:7px;background:rgba(232,52,10,0.09);border:1px solid rgba(232,52,10,0.20);border-radius:100px;padding:6px 14px;font-size:11px;font-weight:700;color:#C02808;margin-bottom:22px;animation:fadeUp .6s ease both;letter-spacing:.5px;text-transform:uppercase}
[data-theme="dark"] .hero-badge{color:#FF7040;background:rgba(232,52,10,0.12)}
.hero-badge .dot{width:6px;height:6px;border-radius:50%;background:#E8340A;animation:pulse 1.8s ease-in-out infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(1.7)}}
.hero h1{font-family:var(--font-h);font-size:clamp(40px,5.5vw,80px);font-weight:900;line-height:.97;letter-spacing:-1px;color:var(--dark);animation:fadeUp .65s .1s ease both}
.hero h1 em{font-style:italic;color:var(--red)}
.hero h1 .underline-word{position:relative;display:inline-block}
.hero h1 .underline-word::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--red),var(--orange));border-radius:3px;transform:scaleX(0);transform-origin:left;animation:ul .7s 1.1s ease forwards}
@keyframes ul{to{transform:scaleX(1)}}
.hero-sub{margin-top:18px;font-size:15px;line-height:1.8;color:var(--muted);max-width:430px;animation:fadeUp .65s .18s ease both}
.typed-cursor{display:inline-block;width:2px;height:18px;background:var(--red);margin-left:2px;animation:blink .8s step-end infinite;vertical-align:text-bottom}
@keyframes blink{50%{opacity:0}}
.search-box{margin-top:30px;animation:fadeUp .65s .26s ease both;max-width:490px}
.search-inner{display:flex;background:var(--card);border-radius:14px;border:1px solid var(--border);box-shadow:var(--sh);overflow:hidden;transition:box-shadow .2s,border-color .2s}
.search-inner:focus-within{border-color:rgba(232,52,10,0.38);box-shadow:var(--sh),var(--sh-glow)}
.search-inner input{flex:1;border:none;outline:none;padding:15px 18px;font-family:var(--font-b);font-size:15px;background:transparent;color:var(--dark);min-width:0}
.search-inner input::placeholder{color:var(--light-muted)}
.search-inner button{background:var(--red);border:none;color:#fff;padding:11px 22px;margin:5px;border-radius:10px;font-family:var(--font-b);font-size:13px;font-weight:700;cursor:pointer;transition:background .2s;flex-shrink:0}
.search-inner button:hover{background:var(--orange)}
.search-chips{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:500;padding:5px 12px;border-radius:100px;background:rgba(160,90,20,0.07);border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .18s}
[data-theme="dark"] .chip{background:rgba(245,166,35,0.05)}
.chip:hover{background:var(--red);border-color:var(--red);color:#fff}
.hero-stats{display:flex;gap:28px;margin-top:30px;animation:fadeUp .65s .34s ease both;flex-wrap:wrap}
.stat-item{display:flex;flex-direction:column}
.stat-num{font-family:var(--font-h);font-size:28px;font-weight:900;color:var(--dark);letter-spacing:-.5px;line-height:1}
.stat-lbl{font-size:10px;color:var(--muted);margin-top:4px;font-weight:500;text-transform:uppercase;letter-spacing:.8px}
.stat-div{width:1px;background:var(--border);align-self:stretch}
.hero-visual{position:relative;height:500px;animation:fadeUp .8s .15s ease both}
.hv-card{position:absolute;top:50px;left:5%;width:270px;background:var(--card);border-radius:20px;box-shadow:var(--sh-lg);overflow:hidden;animation:cardFloat 4.2s ease-in-out infinite;z-index:2;border:1px solid var(--border)}
@keyframes cardFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.hv-card-img{height:145px;background:linear-gradient(135deg,#2d6e4e,#1a4230);display:flex;align-items:center;justify-content:center;font-size:56px;position:relative;overflow:hidden}
.hv-card-img::after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.3),transparent 50%)}
.hv-card-body{padding:14px}
.hv-card-name{font-family:var(--font-h);font-size:14px;font-weight:700;color:var(--dark);margin-bottom:5px}
.hv-card-meta{display:flex;gap:8px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.hv-card-meta .r{color:var(--gold);font-weight:700}
.hv-card-meta .t{color:var(--red);font-weight:700}
.hv-btn{margin-top:12px;width:100%;background:var(--red);color:#fff;border:none;padding:10px;border-radius:100px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font-b);transition:background .2s}
.hv-btn:hover{background:var(--orange)}
.hv-pill{position:absolute;background:var(--card);border-radius:100px;box-shadow:var(--sh);padding:9px 15px;display:flex;align-items:center;gap:9px;z-index:3;border:1px solid var(--border)}
.hv-pill.track{top:14px;right:3%;animation:cardFloat 4.8s 1s ease-in-out infinite}
.hv-pill .pm{font-size:12px;font-weight:600;color:var(--dark)}
.hv-pill .ps{font-size:10px;color:var(--muted)}
.hv-rating{position:absolute;bottom:80px;right:1%;background:linear-gradient(135deg,var(--red),var(--orange));color:#fff;border-radius:16px;padding:14px 18px;animation:cardFloat 5s 2s ease-in-out infinite;z-index:3;box-shadow:0 8px 28px rgba(232,52,10,0.38)}
.hv-rating .rb{font-family:var(--font-h);font-size:22px;font-weight:900}
.hv-rating .rs{font-size:10px;opacity:.82;margin-top:2px;text-transform:uppercase;letter-spacing:.8px}
.hv-food{position:absolute;font-size:80px;filter:drop-shadow(0 8px 20px rgba(0,0,0,.12));animation:hfFloat ease-in-out infinite;user-select:none}
@keyframes hfFloat{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-16px) rotate(5deg)}}
.hv-food:nth-child(1){top:28px;left:6%;animation-duration:3.8s}
.hv-food:nth-child(2){top:190px;left:54%;animation-duration:4.5s;animation-delay:.9s;font-size:68px}
.hv-food:nth-child(3){top:340px;left:18%;animation-duration:5.1s;animation-delay:1.5s;font-size:62px}
.feat-strip{background:var(--strip);position:relative;z-index:1;border-top:1px solid var(--strip-border);border-bottom:1px solid var(--strip-border)}
.feat-strip-inner{display:grid;grid-template-columns:repeat(4,1fr)}
.feat-item{display:flex;align-items:center;gap:12px;padding:20px 18px;border-right:1px solid var(--strip-border);transition:background .2s}
.feat-item:last-child{border-right:none}
.feat-item:hover{background:rgba(232,52,10,0.04)}
.feat-icon{width:36px;height:36px;flex-shrink:0;background:rgba(232,52,10,.11);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;transition:transform .3s}
.feat-item:hover .feat-icon{transform:scale(1.1) rotate(-5deg)}
.feat-txt strong{display:block;font-size:12px;font-weight:700;color:var(--red);line-height:1.3}
.feat-txt span{font-size:10px;color:var(--muted);line-height:1.3}
.section{padding:72px 52px;position:relative;z-index:1}
.eyebrow{font-size:9px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--red);margin-bottom:10px;opacity:.9}
.sec-h{font-family:var(--font-h);font-size:clamp(24px,3vw,42px);font-weight:900;color:var(--dark);letter-spacing:-.5px;line-height:1.05;margin-bottom:12px}
.sec-p{font-size:14px;color:var(--muted);line-height:1.8;max-width:460px}
.cats-section{background:var(--surface2);padding:40px 28px;position:relative;z-index:1;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.cat-scroll{display:flex;gap:7px;margin-top:20px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.cat-scroll::-webkit-scrollbar{display:none}
.cat-pill{flex-shrink:0;display:flex;align-items:center;gap:7px;padding:9px 17px;border-radius:100px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-size:12px;font-weight:600;color:var(--ink);transition:all .2s;white-space:nowrap}
.cat-pill:hover,.cat-pill.active{background:var(--red);border-color:var(--red);color:#fff;transform:translateY(-2px);box-shadow:0 6px 20px rgba(232,52,10,0.26)}
.rest-hd{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px;gap:12px;flex-wrap:wrap}
.rest-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.rest-card{background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--border);box-shadow:var(--sh);text-decoration:none;color:inherit;display:block;transition:transform .22s,box-shadow .22s;position:relative}
.rest-card:hover{transform:translateY(-4px);box-shadow:var(--sh-lg)}
.rc-thumb{height:185px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.rc-thumb-ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.42) 0%,transparent 55%)}
.rc-badge{position:absolute;top:12px;left:12px;padding:4px 11px;border-radius:100px;font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.rc-badge-hot{background:var(--red);color:#fff}
.rc-badge-soon{background:rgba(0,0,0,0.6);color:#fff;backdrop-filter:blur(8px)}
.rc-time{position:absolute;bottom:10px;right:10px;background:rgba(0,0,0,.70);border-radius:100px;padding:4px 10px;font-size:10px;font-weight:700;color:#fff;display:flex;align-items:center;gap:3px;backdrop-filter:blur(8px)}
.rc-body{padding:14px 16px 16px}
.rc-name{font-family:var(--font-h);font-size:16px;font-weight:700;color:var(--dark);letter-spacing:-.2px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc-area{font-size:10px;color:var(--muted);margin-bottom:5px;display:flex;align-items:center;gap:3px}
.rc-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:9px}
.rc-tag{font-size:9px;padding:3px 8px;border-radius:100px;background:var(--tag-bg);color:var(--tag-c);font-weight:600;white-space:nowrap}
.rc-foot{display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px solid var(--border2)}
.rc-rating{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--dark)}
.rc-rating span{font-weight:400;color:var(--muted);font-size:10px}
.rc-meta{display:flex;gap:8px;font-size:10px;color:var(--muted)}
.rc-free{color:#C02808;font-weight:700}
[data-theme="dark"] .rc-free{color:#FF7040}
.how-section{background:var(--strip);position:relative;z-index:1}
.steps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:40px}
.step-card{padding:28px 24px;border-radius:16px;border:1px solid var(--strip-border);background:var(--card);position:relative;overflow:hidden;transition:border-color .25s,box-shadow .25s,transform .25s}
.step-card:hover{border-color:rgba(232,52,10,.30);box-shadow:var(--sh);transform:translateY(-4px)}
.step-num{position:absolute;top:14px;right:18px;font-family:var(--font-h);font-size:64px;font-weight:900;color:rgba(232,52,10,.05);line-height:1;pointer-events:none}
.step-icon{font-size:28px;margin-bottom:14px}
.step-card h3{font-family:var(--font-h);font-size:17px;font-weight:700;color:var(--dark);margin-bottom:8px}
.step-card p{font-size:12px;color:var(--muted);line-height:1.75}
.faq-section{background:var(--surface2);position:relative;z-index:1}
.faq-grid{margin-top:36px;display:flex;flex-direction:column;gap:8px;max-width:760px;margin-left:auto;margin-right:auto}
.faq-item{background:var(--faq-bg);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:box-shadow .2s}
.faq-item:hover{border-color:rgba(232,52,10,0.18);box-shadow:var(--sh)}
.faq-q{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;cursor:pointer;gap:12px}
.faq-q span{font-size:13px;font-weight:600;color:var(--dark);line-height:1.4}
.faq-icon{width:26px;height:26px;border-radius:50%;background:rgba(232,52,10,0.07);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--red);flex-shrink:0;transition:all .25s;font-weight:700}
.faq-item.open .faq-icon{background:var(--red);color:#fff;transform:rotate(45deg)}
.faq-a{max-height:0;overflow:hidden;transition:max-height .35s ease}
.faq-a-inner{padding:0 20px 16px;font-size:13px;color:var(--muted);line-height:1.75}
.faq-item.open .faq-a{max-height:300px}
.partner-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}
.pv-box{background:linear-gradient(145deg,#C02808 0%,#8B1A05 100%);border-radius:20px;padding:32px;position:relative;overflow:hidden;border:1px solid rgba(232,52,10,.3)}
.pv-box::after{content:'🍽️';font-size:150px;position:absolute;right:-12px;bottom:-12px;opacity:.07;pointer-events:none}
.pv-row{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);border-radius:11px;padding:14px 16px;margin-bottom:10px}
.pv-row:last-child{margin-bottom:0}
.pv-label{font-size:11px;font-weight:700;color:#fff;margin-bottom:2px}
.pv-sub{font-size:10px;color:rgba(255,255,255,.55)}
.pstats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:26px}
.pstat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.pstat .n{font-family:var(--font-h);font-size:26px;font-weight:900;color:var(--red)}
.pstat .l{font-size:10px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.8px}
.perks{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.perk{display:flex;align-items:flex-start;gap:10px}
.pchk{width:24px;height:24px;flex-shrink:0;background:rgba(232,52,10,.09);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--red);margin-top:1px}
.perk strong{display:block;font-size:13px;font-weight:700;color:var(--dark)}
.perk small{font-size:11px;color:var(--muted);line-height:1.5}
.overlay{position:fixed;inset:0;background:var(--modal-bg);z-index:800;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.open{opacity:1;pointer-events:all}
.bottom-sheet{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:900px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 -4px 48px rgba(0,0,0,.18);transform:translateY(60px);transition:transform .38s cubic-bezier(.22,1,.36,1);border-top:1px solid var(--border)}
[data-theme="dark"] .bottom-sheet{box-shadow:0 -4px 48px rgba(0,0,0,.60)}
.overlay.open .bottom-sheet{transform:none}
.drag-handle{width:36px;height:3px;border-radius:3px;background:var(--border);margin:12px auto 0;flex-shrink:0}
.menu-head{padding:16px 24px 14px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:14px;flex-shrink:0}
.rest-logo-sm{width:48px;height:48px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;background:linear-gradient(135deg,#2d6e4e,#1a4230)}
.menu-rest-name{font-family:var(--font-h);font-size:17px;font-weight:800;color:var(--dark)}
.menu-rest-meta{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5}
.m-close{margin-left:auto;width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:transparent;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .2s;flex-shrink:0}
.m-close:hover{background:var(--red);border-color:var(--red);color:#fff}
.menu-tabs-row{display:flex;gap:3px;padding:10px 24px;border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.menu-tabs-row::-webkit-scrollbar{display:none}
.mtab{padding:7px 13px;border-radius:100px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .2s;border:none;background:transparent;font-family:var(--font-b)}
.mtab.active,.mtab:hover{background:var(--red);color:#fff}
.menu-body{overflow-y:auto;padding:16px 24px;flex:1;max-height:55svh}
.menu-sec-title{font-family:var(--font-h);font-size:15px;font-weight:700;color:var(--dark);margin-bottom:2px}
.menu-sec-sub{font-size:10px;color:var(--muted);margin-bottom:10px}
.menu-items{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.menu-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);transition:box-shadow .2s}
.menu-item:hover{box-shadow:var(--sh)}
.mi-info{flex:1;min-width:0}
.mi-name{font-size:12px;font-weight:700;color:var(--dark);margin-bottom:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mi-desc{font-size:11px;color:var(--muted);line-height:1.5;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mi-sizes{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.sz-btn{font-size:10px;padding:4px 10px;border-radius:100px;border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .18s;background:transparent;font-family:var(--font-b)}
.sz-btn:hover,.sz-btn.picked{background:var(--red);border-color:var(--red);color:#fff}
.mi-right{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex-shrink:0}
.mi-price{font-family:var(--font-h);font-size:13px;font-weight:700;color:var(--dark);white-space:nowrap}
.add-btn{width:28px;height:28px;border-radius:50%;background:var(--red);border:none;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,transform .15s}
.add-btn:hover{background:var(--orange);transform:scale(1.12)}
.menu-cart-bar{flex-shrink:0;padding:14px 24px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--card);gap:10px}
.cart-info{font-size:12px;color:var(--muted)}
.cart-info strong{color:var(--dark)}
.cart-go{background:var(--red);color:#fff;border:none;padding:12px 26px;border-radius:100px;font-size:13px;font-weight:700;cursor:pointer;font-family:var(--font-b);transition:background .2s;white-space:nowrap;flex-shrink:0}
.cart-go:hover{background:var(--orange)}
.new-tag{font-size:8px;font-weight:700;padding:2px 7px;border-radius:100px;background:var(--green);color:#fff;vertical-align:middle;letter-spacing:.5px;text-transform:uppercase}
.auth-sheet{max-width:440px;max-height:96svh}
.auth-inner{padding:20px 24px 30px;overflow-y:auto}
.auth-logo{font-family:var(--font-h);font-size:18px;font-weight:900;color:var(--dark);margin-bottom:16px}
.auth-logo span{color:var(--red)}
.auth-title{font-family:var(--font-h);font-size:22px;font-weight:900;color:var(--dark);margin-bottom:4px}
.auth-sub{font-size:12px;color:var(--muted);margin-bottom:20px;line-height:1.65}
.form-field{margin-bottom:12px}
.form-field label{display:block;font-size:9px;font-weight:700;color:var(--muted);margin-bottom:5px;letter-spacing:1.5px;text-transform:uppercase}
.form-field input{width:100%;padding:13px 15px;border:1px solid var(--input-border);border-radius:11px;background:var(--input-bg);color:var(--dark);font-family:var(--font-b);font-size:14px;outline:none;transition:border-color .2s}
.form-field input:focus{border-color:rgba(232,52,10,0.42);box-shadow:var(--sh-glow)}
.form-field input::placeholder{color:var(--light-muted)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-err{font-size:10px;color:#dc2626;margin-top:4px;display:none}
.form-field.error input{border-color:#dc2626}
.form-field.error .form-err{display:block}
.auth-or{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--muted);font-size:11px;font-weight:600}
.auth-or::before,.auth-or::after{content:'';flex:1;height:1px;background:var(--border)}
.social-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;padding:12px;border-radius:11px;border:1px solid var(--border);background:var(--input-bg);color:var(--ink);font-family:var(--font-b);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;margin-bottom:8px;text-decoration:none}
.social-btn:hover{border-color:var(--red);background:rgba(232,52,10,.04)}
.auth-btn-main{width:100%;background:var(--red);color:#fff;border:none;padding:14px;border-radius:100px;font-family:var(--font-b);font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;transition:background .2s,transform .15s;box-shadow:0 4px 20px rgba(232,52,10,.26)}
.auth-btn-main:hover{background:var(--orange);transform:translateY(-1px)}
.auth-toggle-txt{margin-top:16px;text-align:center;font-size:12px;color:var(--muted)}
.auth-toggle-txt a{color:var(--red);font-weight:700;cursor:pointer}
.pw-strength{margin-top:5px;height:2px;border-radius:2px;background:var(--border);overflow:hidden}
.pw-bar{height:100%;border-radius:2px;width:0;transition:width .3s,background .3s}
.co-sheet{max-width:460px;max-height:96svh}
.co-inner{padding:20px 24px 30px;overflow-y:auto}
.co-title{font-family:var(--font-h);font-size:20px;font-weight:900;color:var(--dark);margin-bottom:3px}
.co-sub{font-size:12px;color:var(--muted);margin-bottom:18px;line-height:1.6}
.co-sec{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.order-summary{background:var(--surface);border-radius:11px;padding:12px 14px;margin-bottom:4px;border:1px solid var(--border)}
.os-row{display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid var(--border2)}
.os-row:last-child{border-bottom:none;font-weight:700;color:var(--dark)}
.os-row.muted{color:var(--muted)}
.pay-opts{display:flex;gap:7px;flex-wrap:wrap}
.pay-btn{padding:9px 15px;border-radius:10px;border:1px solid var(--border);font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;background:var(--surface);font-family:var(--font-b);transition:all .2s}
.pay-btn.active,.pay-btn:hover{border-color:var(--red);color:var(--red);background:rgba(232,52,10,.05)}
.place-btn{width:100%;background:var(--red);color:#fff;border:none;padding:16px;border-radius:100px;font-family:var(--font-b);font-size:14px;font-weight:700;cursor:pointer;margin-top:16px;box-shadow:0 4px 20px rgba(232,52,10,.26);transition:background .2s;display:block;text-align:center;text-decoration:none}
.place-btn:hover{background:var(--orange)}
.receipt-sheet{max-width:480px;max-height:96svh}
.receipt-inner{padding:20px 24px 30px;overflow-y:auto}
.receipt-header{text-align:center;padding-bottom:16px;border-bottom:2px dashed var(--border);margin-bottom:16px}
.rh-logo{font-family:var(--font-h);font-size:24px;font-weight:900;color:var(--dark)}
.rh-logo span{color:var(--red)}
.receipt-check{width:56px;height:56px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 12px;box-shadow:0 4px 18px rgba(22,163,74,0.3)}
.receipt-status{font-family:var(--font-h);font-size:20px;font-weight:900;color:var(--dark);margin-bottom:4px}
.receipt-orderno{font-size:12px;color:var(--muted)}
.receipt-section{margin-top:16px;padding-top:12px;border-top:1px dashed var(--border)}
.receipt-section h4{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
.receipt-row{display:flex;justify-content:space-between;align-items:flex-start;font-size:12px;padding:4px 0;color:var(--ink)}
.receipt-row.total{font-size:14px;font-weight:700;color:var(--dark);padding:8px 0;border-top:2px solid var(--dark);margin-top:4px}
.receipt-row .item-qty{color:var(--muted);font-size:11px}
.receipt-info{background:var(--surface2);border:1px solid var(--border);border-radius:11px;padding:12px 14px;font-size:12px;color:var(--ink);line-height:1.7}
.receipt-info strong{color:var(--dark)}
.receipt-actions{margin-top:20px;display:flex;flex-direction:column;gap:8px}
.receipt-actions a,.receipt-actions button{display:flex;align-items:center;justify-content:center;gap:8px;padding:13px;border-radius:12px;font-family:var(--font-b);font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;text-decoration:none;border:none;width:100%}
.wa-btn{background:#25D366;color:#fff;box-shadow:0 4px 16px rgba(37,211,102,0.3)}
.wa-btn:hover{background:#1ebe57;transform:translateY(-1px)}
.outline-btn{background:transparent;border:1px solid var(--border);color:var(--ink)}
.outline-btn:hover{border-color:var(--red);color:var(--red)}
.print-btn{background:var(--surface);border:1px solid var(--border);color:var(--ink)}
.print-btn:hover{border-color:var(--dark)}
.receipt-footer{text-align:center;margin-top:16px;padding-top:12px;border-top:1px dashed var(--border);font-size:11px;color:var(--muted);line-height:1.7}
.dash-panel{position:fixed;top:0;right:0;bottom:0;z-index:700;width:380px;max-width:100vw;background:var(--card);box-shadow:-6px 0 48px rgba(0,0,0,.12);transition:transform .38s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;border-left:1px solid var(--border);transform:translateX(100%)}
.dash-panel.open{transform:none}
.dash-head{padding:20px 22px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0;background:linear-gradient(135deg,rgba(232,52,10,.06),rgba(245,96,15,.02))}
.d-av{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--red),var(--orange));display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;flex-shrink:0;box-shadow:0 4px 18px rgba(232,52,10,.28)}
.d-name{font-family:var(--font-h);font-size:16px;font-weight:700;color:var(--dark)}
.d-email{font-size:11px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.d-close{margin-left:auto;width:30px;height:30px;border-radius:50%;border:1px solid var(--border);background:transparent;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .2s;flex-shrink:0}
.d-close:hover{background:var(--red);border-color:var(--red);color:#fff}
.dash-body{overflow-y:auto;flex:1;padding:18px 22px}
.d-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:22px}
.d-stat{background:var(--dash-bg);border-radius:12px;padding:14px;border:1px solid var(--border)}
.d-stat .dsn{font-family:var(--font-h);font-size:22px;font-weight:900;color:var(--red)}
.d-stat .dsl{font-size:10px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.8px}
.d-sec{font-family:var(--font-h);font-size:13px;font-weight:700;color:var(--dark);margin-bottom:10px}
.d-info-card{background:var(--dash-bg);border:1px solid var(--border);border-radius:11px;padding:13px 15px;margin-bottom:18px}
.d-info-row{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--ink);margin-bottom:7px}
.d-info-row:last-child{margin-bottom:0}
.d-info-row .ico{font-size:13px;flex-shrink:0;margin-top:1px}
.d-info-row span{color:var(--muted);font-size:11px;display:block}
.oh-list{display:flex;flex-direction:column;gap:7px}
.oh-item{background:var(--dash-bg);border-radius:11px;padding:11px 13px;border:1px solid var(--border);display:flex;align-items:center;gap:10px}
.oh-icon{font-size:22px;flex-shrink:0}
.oh-info{flex:1;min-width:0}
.oh-name{font-size:12px;font-weight:600;color:var(--dark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oh-meta{font-size:10px;color:var(--muted);margin-top:2px}
.oh-price{font-family:var(--font-h);font-size:13px;font-weight:700;color:var(--red);flex-shrink:0}
.d-logout{margin-top:20px;width:100%;padding:12px;border-radius:11px;border:1px solid var(--border);background:transparent;font-family:var(--font-b);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .2s}
.d-logout:hover{border-color:#dc2626;color:#dc2626;background:rgba(220,38,38,.05)}
.legal-sheet{max-width:620px;max-height:90svh}
.legal-inner{padding:20px 28px 32px;overflow-y:auto;position:relative}
.legal-inner h2{font-family:var(--font-h);font-size:22px;font-weight:900;color:var(--dark);margin-bottom:6px}
.legal-inner .legal-meta{font-size:11px;color:var(--muted);margin-bottom:20px}
.legal-inner h3{font-size:13px;font-weight:700;color:var(--dark);margin:18px 0 7px;text-transform:uppercase;letter-spacing:.8px}
.legal-inner p{font-size:12px;color:var(--muted);line-height:1.8;margin-bottom:8px}
.legal-inner ul{padding-left:16px;margin-bottom:8px}
.legal-inner li{font-size:12px;color:var(--muted);line-height:1.8;margin-bottom:4px}
footer{background:#100601;padding:48px 28px 28px;position:relative;z-index:1;border-top:1px solid rgba(160,90,20,0.08)}
.foot-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:36px;margin-bottom:40px}
.foot-brand .fb-logo{font-family:var(--font-h);font-size:22px;font-weight:900;color:#F5EAD8;margin-bottom:5px}
.foot-brand .fb-logo span{color:var(--red)}
.foot-brand .fb-loc{font-size:11px;color:rgba(245,235,200,.28);margin-bottom:3px;display:flex;align-items:center;gap:5px}
.foot-brand .fb-loc a{color:rgba(232,52,10,.65);text-decoration:none;transition:color .2s}
.foot-brand .fb-loc a:hover{color:var(--red)}
.foot-brand .fb-sub{font-size:12px;color:rgba(245,235,200,.22);line-height:1.75;max-width:200px;margin-top:6px}
.foot-socials{display:flex;gap:8px;margin-top:14px}
.foot-social{width:34px;height:34px;border-radius:50%;background:rgba(245,235,200,0.06);border:1px solid rgba(245,235,200,0.08);display:flex;align-items:center;justify-content:center;font-size:14px;text-decoration:none;transition:all .2s;cursor:pointer}
.foot-social:hover{background:var(--red);border-color:var(--red);transform:translateY(-2px)}
.foot-col h5{font-size:9px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:rgba(245,235,200,.20);margin-bottom:14px}
.foot-col ul{list-style:none;display:flex;flex-direction:column;gap:10px}
.foot-col a{font-size:12px;color:rgba(245,235,200,.35);text-decoration:none;transition:color .2s;cursor:pointer}
.foot-col a:hover{color:#F5EAD8}
.foot-bot{border-top:1px solid rgba(245,235,200,.06);padding-top:20px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:rgba(245,235,200,.18);flex-wrap:wrap;gap:8px}
.foot-bot a{color:rgba(245,235,200,.18);text-decoration:none;cursor:pointer;transition:color .2s}
